name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy note:** Please do not paste window titles, URLs, or
        screenshots of your usage data. Describe the problem instead.
  - type: input
    id: version
    attributes:
      label: Snooper version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce

